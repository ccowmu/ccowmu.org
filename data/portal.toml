# HOW TO EDIT THIS FILE
#
# Blinkies (150x20) and stamps (99x56) are image files.
# Put a file in the matching folder and it shows on the site:
#   static/images/blinkies/
#   static/images/stamps/
# The file name becomes the alt text. To set a link or better alt text,
# add an entry with the file name, like this:
#
# [[blinkies]]
# file = "surfthenet.gif"
# alt = "surf the net"
# url = "https://example.com"
#
# The same shape works for [[stamps]].
#
# The featured table is the big panel on the home page. Change it for each event.
# Each service tile uses one icon: chat, minutes, wiki or stream.
# The stream table names the Twitch channel for the Live panel.
# The terminal commands live in data/terminal.toml.

