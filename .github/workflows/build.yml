name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.1'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.js
        env:
          HUGO_ENV: production
      - run: ./build.sh
      - run: test -f public/minutes/search.json
